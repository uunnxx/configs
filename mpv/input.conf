# Rotate video in 90 degree increments.
Alt+LEFT script-message Cycle_Video_Rotate "counter-clockwise"
Alt+RIGHT script-message Cycle_Video_Rotate "clockwise"

LEFT seek -5
RIGHT seek 5

Shift+LEFT seek -15
Shift+RIGHT seek 15


mbtn_mid    script-binding uosc/menu
p           script-binding uosc/items
c           script-binding uosc/chapters
tab         script-binding uosc/toggle-ui
